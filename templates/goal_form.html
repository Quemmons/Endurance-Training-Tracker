{% extends 'base.html' %}
{% block title %}{{ action }} Goal – Milestones{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="card shadow-sm">
      <div class="card-body">
        <h1 class="h4 mb-4">{{ action }} Goal</h1>
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Goal type</label>
            <select class="form-select" name="goal_type" required>
              <option value="">Select goal type</option>
              {% for type in goal_types %}
              <option value="{{ type }}" {% if goal and goal['goal_type'] == type %}selected{% endif %}>{{ type.capitalize() }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Target (miles)</label>
            <input class="form-control" name="target_value" type="number" step="0.01" required value="{{ goal['target_value'] if goal else '' }}">
          </div>
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label">Start date</label>
              <input class="form-control" name="start_date" type="date" required value="{{ goal['start_date'] if goal else '' }}">
            </div>
            <div class="col-md-6">
              <label class="form-label">End date</label>
              <input class="form-control" name="end_date" type="date" required value="{{ goal['end_date'] if goal else '' }}">
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" name="description" rows="3">{{ goal['description'] if goal else '' }}</textarea>
          </div>
          <button class="btn btn-primary">{{ action }} Goal</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
