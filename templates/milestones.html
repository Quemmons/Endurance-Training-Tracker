{% extends 'base.html' %}
{% block title %}Milestones – Milestone{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-10">
    <div class="card shadow-sm p-4">
      <h1 class="h4 mb-3">Milestones</h1>
      <p class="text-muted">Fun facts about your training — click the card to flip through them.</p>
      <div id="milestoneArea" style="display:flex; align-items:center; justify-content:center; height:300px; background:#f8f9fa; border-radius:.5rem; border:1px solid #e9ecef;">
        <div class="flip-card" id="flipCard" role="button" tabindex="0" aria-label="Milestone">
          <div class="flip-inner" id="flipInner">
            <div class="flip-front p-4 text-center" id="flipFront">Loading...</div>
            <div class="flip-back p-4 text-center" id="flipBack" style="display:none;"></div>
          </div>
        </div>
      </div>
      <div class="mt-3">
        <label for="heightInput">Enter your height (in inches) to compute "Amount of you lined up":</label>
        <div class="input-group mb-3">
          <input id="heightInput" class="form-control" placeholder="e.g. 72">
          <button id="heightBtn" class="btn btn-primary">Calculate</button>
        </div>
        <div id="heightResult" class="small text-muted"></div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
(async function(){
  let list = [];
  try{
    const res = await fetch('{{ url_for('api_milestones') }}');
    // if the server redirected to login, show message
    if(res.redirected && res.url.endsWith('/login')){
      front.textContent = 'Log in to see milestones.';
      return;
    }
    if(!res.ok) throw new Error('Failed to load');
    const data = await res.json();
    list = data.milestones || [];
  }catch(err){
    console.error('Could not load milestones', err);
    front.textContent = 'Unable to load milestones.';
    list = [];
  }
  const front = document.getElementById('flipFront');
  const back = document.getElementById('flipBack');
  const card = document.getElementById('flipCard');

  let idx = 0;
  function showInitial(){
    if(list.length === 0){ front.textContent = 'No milestones yet.'; return; }
    front.textContent = list[0];
    idx = 1 % list.length;
  }
  showInitial();

  function flipToNext(){
    if(list.length === 0) return;
    const next = list[idx % list.length];
    // prepare back
    back.style.display = 'block';
    back.textContent = next;
    // trigger flip
    card.classList.add('flipped');
    // after animation, promote back to front and reset
    setTimeout(()=>{
      front.textContent = next;
      card.classList.remove('flipped');
      back.style.display = 'none';
      idx = (idx + 1) % list.length;
    }, 600);
  }

  card.addEventListener('click', flipToNext);
  card.addEventListener('keydown', (e)=>{ if(e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flipToNext(); }});

  document.getElementById('heightBtn').addEventListener('click', async ()=>{
    const inches = parseFloat(document.getElementById('heightInput').value);
    if(!inches || inches <= 0){ document.getElementById('heightResult').textContent = 'Enter a valid height in inches.'; return; }
    // fetch latest milestones to ensure we have totals
    try{
      const r = await fetch('{{ url_for('api_milestones') }}');
      if(!r.ok) throw new Error('Failed');
      const d = await r.json();
      const m = (d.milestones && d.milestones[0]) || '';
      const match = m.match(/covered ([0-9,.]+) miles/);
      let total = 0;
      if(match){ total = parseFloat(match[1].replace(/,/g,'')); }
      const inches_per_mile = 63360;
      const count = Math.round((total * inches_per_mile) / inches);
      document.getElementById('heightResult').textContent = `You have run the length of ${count.toLocaleString()} versions of yourself.`;
    }catch(e){
      document.getElementById('heightResult').textContent = 'Unable to compute right now.';
    }
  });
})();
</script>
{% endblock %}
