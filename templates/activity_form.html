{% extends 'base.html' %}
{% block title %}{{ action }} Activity – Milestones{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="card shadow-sm">
      <div class="card-body">
        <h1 class="h4 mb-4">{{ action }} Activity</h1>
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Activity type</label>
            <input class="form-control" value="Run" disabled>
            <input type="hidden" name="activity_type" value="run">
          </div>
          <div class="row g-3">
            <div class="col-md-6 mb-3">
              <label class="form-label">Distance (miles)</label>
              <input class="form-control" name="distance" type="number" step="0.01" required value="{{ activity['distance'] if activity else '' }}">
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Pace (min:sec per mile)</label>
              <input class="form-control" name="pace" id="paceInput" placeholder="e.g. 7:30" value="{{ pace_value if pace_value else '' }}">
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Duration (minutes)</label>
              <input class="form-control" name="duration" id="durationInput" type="number" step="1" required value="{{ activity['duration'] if activity else '' }}">
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Date and time</label>
            <input class="form-control" name="date_time" type="datetime-local" required value="{{ activity['date_time'][:16] if activity else default_date_time }}">
          </div>
          <div class="mb-3">
            <label class="form-label">Location (optional)</label>
            <input class="form-control" name="location" value="{{ activity['location'] if activity else '' }}">
          </div>
          <div class="mb-3">
            <label class="form-label">Notes</label>
            <textarea class="form-control" name="notes" rows="4">{{ activity['notes'] if activity else '' }}</textarea>
          </div>
          <button class="btn btn-primary">{{ action }} Activity</button>
        </form>
      </div>
    </div>
  </div>
</div>
  <script>
  // Sync pace and duration fields client-side for convenience.
  function parsePaceToMinutes(str){
    if(!str) return null;
    str = String(str).trim();
    if(str.indexOf(':') !== -1){
      const parts = str.split(':');
      const minutes = parseFloat(parts[0]) || 0;
      const seconds = parseFloat(parts[1]) || 0;
      return minutes + seconds/60;
    }
    const f = parseFloat(str);
    return isNaN(f) ? null : f;
  }

  document.addEventListener('DOMContentLoaded', ()=>{
    const pace = document.getElementById('paceInput');
    const duration = document.getElementById('durationInput');
    const distance = document.querySelector('input[name="distance"]');
    function updateDurationFromPace(){
      const p = parsePaceToMinutes(pace.value);
      const d = parseFloat(distance.value);
      if(p !== null && d > 0){
        duration.value = Math.round(p * d);
      }
    }
    function updatePaceFromDuration(){
      const dur = parseFloat(duration.value);
      const d = parseFloat(distance.value);
      if(d > 0 && dur > 0){
        const paceMin = dur / d;
        const m = Math.floor(paceMin);
        let s = Math.round((paceMin - m) * 60);
        if(s === 60){ m += 1; s = 0; }
        pace.value = `${m}:${s.toString().padStart(2,'0')}`;
      }
    }
    if(pace) pace.addEventListener('change', updateDurationFromPace);
    if(distance) distance.addEventListener('change', ()=>{ updateDurationFromPace(); updatePaceFromDuration(); });
    if(duration) duration.addEventListener('change', updatePaceFromDuration);
  });
  </script>
{% endblock %}
